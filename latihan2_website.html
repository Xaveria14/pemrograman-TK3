<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latihan Web02</title>

    <style>
        form {
            width: 680px;
            height: 410px;
            border: 3px solid gray;
            padding: 30px 20px;

            /* Agar muncul scrollbar seperti gambar */
            overflow: scroll;
        }

        label {
            display: inline-block;
            width: 110px;
            margin-bottom: 12px;
            font-size: 20px;
            font-family: serif;
        }

        input {
            width: 450px;
            height: 28px;
            font-size: 18px;
            box-sizing: border-box;
        }

        textarea {
            width: 370px;
            height: 140px;
            vertical-align: top;
            font-size: 18px;
            font-family: monospace;
            resize: none;
        }

        .postcode {
            width: 270px;
        }
    </style>
</head>

<body>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="you name here">
        <br>

        <label>Email:</label>
        <input type="email" placeholder="your email here">
        <br>

        <label>Address:</label>
        <textarea type="address" placeholder="your address here" ></textarea>
        <br>

        <label>Postcode:</label>
        <input type="text" class="postcode" placeholder="postal code">

    </form>

</body>
</html>
