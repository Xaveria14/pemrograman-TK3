<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latihan Web02</title>

    <style>
        form {
            width: 380px;
            height: 230px;
            border: 3px solid rgb(128, 128, 128);
            padding: 20px 10px;
        }

        label {
            display: inline-block;
            width: 60px;
            margin-bottom: 10px;
        }

        input {
            width: 240px;
            height: 18px;
        }

        textarea {
            width: 205px;
            height: 75px;
            vertical-align: top;
        }

        .postcode {
            width: 140px;
        }
    </style>
</head>

<body>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="you name here">
        <br>

        <label>Email:</label>
        <input type="email" placeholder="your email here">
        <br>

        <label>Address:</label>
        <textarea>
            25 Nowhere Street
Somewhere
Not Here
Y2K SRU</textarea>
        <br>

        <label>Postcode:</label>
        <input type="text" class="postcode" placeholder="postal code">

    </form>

</body>
</html>
