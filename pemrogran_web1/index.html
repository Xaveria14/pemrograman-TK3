<!DOCTYPE html>
<html lang="id"> <!--halaman menggunakan bahasa Indonesia-->
<head>
    <meta charset="UTF-8">
<!--kumpulan karakter itu charset-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- digunakan untuk tampilan sesuai dengan layar -->

    <title>LATIHAN 1</title>

    <style>

        header {
            height: 45px;
            background-color: #ffe5c7;
            text-align: center;
            padding-top: 20px;
        }

        nav {
            height: 38px; 
            background-color: #d9e8ff;
            text-align: center;
            padding-top: 10px;
        }

        main {
            height: 180px;
            background-color: #f7cccc;
            padding: 30px 40px;
        }
            <!--jarak spacePADDING-->
        aside {
            height: 180px;
            background-color: #d8ead3;
            padding: 30px 40px;
            vertical-align: top;
            font-size: 12px;
        }

        footer {
            height: 38px;
            background-color: #ffe5c7;
            text-align: center;
            padding-top: 10px;
        }
table {
    width: 520px;
    border-collapse: collapse;
    border: 1px solid #f7cccc;
}

td {
    border: 1px solid #f7cccc;
}
    </style>

</head>
<body>
<table border="1">

<tr> 
    <td colspan="2">
        <header>
            HEADER
        </header>
<!--bagian halaman atas (header)-->
    </td>
</tr>

 <tr>
            <td colspan="2">
            <!--penggabungan kolom menjadi (colspan)-->
                <nav>
                    NAVIGASI
                </nav>
            </td>
        </tr>
<tr>
    <td style="width: 400px;">
         <main>
                <h1>Heading 1</h1>  <!--h1 untuk membuat ukuran font-->
                <p>
                Lorem ipsum dolor sit amet, consectetur
                adipiscing elit, sed do eiusmod tempor
                incididunt ut labore et dolore magna aliqua.
                </p>
         </main>
    </td>
    <td style="width: 120px; background-color: #d8ead3;" >
  
        <aside>
            <strong>Menu:</strong>
                <ul> <!--Unordered list-->
                    <li>Home</li>    <!--list item-->
                    <li>Berita</li>
                    <li>Layanan</li>
                    <li>Kontak</li>
                </ul>
           
        </aside>
    </td>
</tr>
<tr>
    <td colspan="2">
        <footer>
            FOOTER
        </footer>
    </td>
</tr>
</table border="1">

</body>
</html>
